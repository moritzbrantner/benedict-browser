<style include="cr-shared-style settings-shared md-select"></style>

<settings-section
  id="nsfw-filter"
  page-title="$i18n{nsfwFilterPageTitle}">

  <settings-toggle-button class="cr-row first"
      pref="{{prefs.brave.nsfw_filter.enabled}}"
      label="$i18n{nsfwFilterLabel}">
  </settings-toggle-button>
  <template is="dom-if" if="[[prefs.brave.nsfw_filter.enabled.value]]">
    <div class="cr-row continuation">
      <div class="flex cr-padded-text" aria-hidden="true">
        $i18n{nsfwFilterModerateActionLabel}
      </div>
      <settings-dropdown-menu id="nsfwModerateAction"
          label="$i18n{nsfwFilterModerateActionLabel}"
          pref="{{prefs.brave.nsfw_filter.moderate_action}}"
          menu-options="[[nsfwFilterActionOptions_]]">
      </settings-dropdown-menu>
    </div>
    <div class="cr-row continuation">
      <div class="flex cr-padded-text" aria-hidden="true">
        $i18n{nsfwFilterHighActionLabel}
      </div>
      <settings-dropdown-menu id="nsfwHighAction"
          label="$i18n{nsfwFilterHighActionLabel}"
          pref="{{prefs.brave.nsfw_filter.high_action}}"
          menu-options="[[nsfwFilterActionOptions_]]">
      </settings-dropdown-menu>
    </div>
  </template>

</settings-section>
